<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blades of Hex · 管理后台</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="adminRoot">

    <!-- ===== 登录页 ===== -->
    <div id="loginScreen" class="login-overlay">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">海克斯之剑</h1>
                <p class="login-subtitle">ADMINISTRATION</p>
            </div>
            <div class="login-divider"></div>
            <input type="password" id="passwordInput" class="login-input" placeholder="管理员密码" autofocus autocomplete="off" spellcheck="false">
            <button id="loginBtn" class="admin-btn primary full">登录</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- ===== 仪表盘 ===== -->
    <div id="dashboard" style="display:none">
        <div class="dash-topbar">
            <span class="dash-topbar-title">BLADES OF HEX · 管理后台</span>
            <span id="statusBadge" class="status-badge stopped"><span class="status-dot"></span><span id="statusLabel">已停止</span></span>
            <span id="uptimeDisplay" class="uptime-text"></span>
            <span id="memDisplay" class="uptime-text"></span>
            <button id="logoutBtn" class="admin-btn tiny secondary">登出</button>
        </div>

        <div class="dash-main">
            <div class="dash-left">
                <div class="admin-panel">
                    <div class="panel-label">服务器</div>
                    <div class="btn-row">
                        <button id="startBtn" class="admin-btn">▶ 启动</button>
                        <button id="stopBtn" class="admin-btn danger" disabled>■ 停止</button>
                        <button id="restartBtn" class="admin-btn secondary" disabled>↻ 重启</button>
                    </div>
                    <div class="panel-divider"></div>
                    <div class="port-row">
                        <label class="port-label">HTTP <input type="number" id="httpPortInput" class="port-input" value="3000"></label>
                        <label class="port-label">HTTPS <input type="number" id="httpsPortInput" class="port-input" value="3443"></label>
                        <button id="applyPortsBtn" class="admin-btn tiny secondary">应用</button>
                    </div>
                </div>

                <div class="admin-panel">
                    <div class="panel-label">运维</div>
                    <div class="btn-col">
                        <button id="initServerBtn" class="admin-btn secondary">初始化服务器</button>
                        <button id="generateCertBtn" class="admin-btn secondary">生成 TLS 证书</button>
                        <button id="flushRoomsBtn" class="admin-btn danger">清空所有房间</button>
                        <button id="exportLogsBtn" class="admin-btn secondary">导出日志</button>
                        <button id="autoStartBtn" class="admin-btn secondary">注册开机自启</button>
                    </div>
                </div>
            </div>

            <div class="dash-right">
                <div class="admin-panel room-panel">
                    <div class="panel-label" style="margin-bottom:14px">活跃房间 <button id="refreshRoomsBtn" class="admin-btn tiny secondary" style="margin-left:12px">刷新</button></div>
                    <div id="roomGrid" class="admin-room-grid"></div>
                    <div id="roomListEmpty" class="admin-empty">当前无活跃房间</div>
                </div>
            </div>
        </div>

        <div class="admin-panel log-panel">
            <div class="panel-label log-panel-header">
                实时日志
                <span class="log-tools">
                    <button id="clearLogBtn" class="admin-btn tiny secondary">清空</button>
                    <button id="bumpCacheBtn" class="admin-btn tiny secondary">刷新客户端缓存</button>
                    <label class="auto-scroll-label"><input type="checkbox" id="autoScrollCheck" checked> 自动滚动</label>
                </span>
            </div>
            <div id="logTerminal" class="log-terminal"></div>
        </div>
    </div>

</div>

<script src="admin.js"></script>
</body>
</html>
