<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blades of Hex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 竖屏提示 -->
<div id="portraitWarning">
    <span>📱</span>
    <span>请将设备横屏使用</span>
</div>

<!-- ===== 大厅（默认显示） ===== -->
<div id="lobbyOverlay">
    <div class="lobby-box">
        <div class="lobby-header">
            <h1 class="lobby-title">海克斯之剑</h1>
            <p class="lobby-subtitle">BLADES OF HEX</p>
        </div>

        <div id="lobbyModes" class="lobby-modes">
            <button class="lobby-btn" id="localModeBtn">
                <span class="lbtn-icon">⚔</span>
                <span class="lbtn-body">
                    <span class="lbtn-name">本地双人对战</span>
                    <span class="lbtn-desc">同一台电脑，轮流操作</span>
                </span>
            </button>
            <button class="lobby-btn" id="hostModeBtn">
                <span class="lbtn-icon">🏠</span>
                <span class="lbtn-body">
                    <span class="lbtn-name">创建联网对战</span>
                    <span class="lbtn-desc">在局域网内开放房间</span>
                </span>
            </button>
            <button class="lobby-btn" id="joinModeBtn">
                <span class="lbtn-icon">🔗</span>
                <span class="lbtn-body">
                    <span class="lbtn-name">加入联网对战</span>
                    <span class="lbtn-desc">输入主机 IP 地址加入</span>
                </span>
            </button>
        </div>

        <div id="joinForm" class="join-form" style="display:none">
            <div id="joinModeChoice">
                <button class="lobby-btn" id="autoScanBtn">
                    <span class="lbtn-icon">🔍</span>
                    <span class="lbtn-body">
                        <span class="lbtn-name">自动扫描</span>
                        <span class="lbtn-desc">扫描局域网，自动连接第一个主机</span>
                    </span>
                </button>
                <button class="lobby-btn" id="manualConnectBtn">
                    <span class="lbtn-icon">⌨</span>
                    <span class="lbtn-body">
                        <span class="lbtn-name">手动连接</span>
                        <span class="lbtn-desc">手动输入主机 IP 地址</span>
                    </span>
                </button>
                <button class="lobby-btn compact secondary" id="backBtn" style="margin-top:8px;">返回</button>
            </div>
            <div id="manualForm" style="display:none">
                <label class="join-label">主机 IP 地址</label>
                <input type="text" id="serverIpInput" class="ip-input" placeholder="192.168.x.x" autocomplete="off" spellcheck="false">
                <div class="join-btns" style="margin-top:10px;">
                    <button class="lobby-btn compact" id="connectBtn" disabled>连接</button>
                    <button class="lobby-btn compact secondary" id="backToChoiceBtn">返回</button>
                </div>
            </div>
        </div>

        <div id="lobbyStatus" class="lobby-status"></div>
    </div>
</div>

<!-- ===== 游戏主体（开始后显示） ===== -->
<div id="gameWrapper" style="display:none">

    <div id="gameMain">

        <!-- 顶部信息条 -->
        <div id="topBar">

            <!-- 红军信息卡 -->
            <div class="camp-card" id="campCard1">
                <div class="camp-emblem" style="background:rgba(176,48,32,0.9);">红</div>
                <div class="camp-info">
                    <div class="camp-label">红军</div>
                    <div class="camp-treasury">
                        <span id="player1Gold">40</span>
                        <span class="treasury-unit">金</span>
                    </div>
                </div>
            </div>

            <!-- 回合指示器 -->
            <div class="turn-hub">
                <span class="turn-label">当前回合</span>
                <span id="currentTurn" class="turn-name">红军</span>
            </div>

            <!-- 蓝军信息卡 -->
            <div class="camp-card align-right" id="campCard2">
                <div class="camp-info align-right">
                    <div class="camp-label">蓝军</div>
                    <div class="camp-treasury">
                        <span id="player2Gold">40</span>
                        <span class="treasury-unit">金</span>
                    </div>
                </div>
                <div class="camp-emblem" style="background:rgba(28,100,160,0.9);">蓝</div>
            </div>

            <!-- 工具栏 -->
            <div class="topbar-tools">
                <div id="networkIndicator">
                    <span>🌐</span>
                    <span id="networkRoleText"></span>
                </div>
                <button class="tool-btn" id="saveGameBtn" title="存档 (Ctrl+S)">💾</button>
                <button class="tool-btn" id="loadGameBtn" title="读档 (Ctrl+L)">📂</button>
                <button class="tool-btn" id="settingsBtn" title="设置">⚙</button>
            </div>

        </div>

        <!-- 棋盘 -->
        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="1000" height="750"></canvas>
            <div id="opponentTurnBanner">
                <span>⏳</span><span>等待对手行动...</span>
            </div>
        </div>

    </div>

    <!-- 右侧指挥面板 -->
    <div id="rightPanel">

        <div id="commandPanel" data-camp="p1">

            <!-- 招募区 -->
            <div class="cmd-section">
                <div class="section-label">招募部队</div>
                <div class="recruit-grid">
                    <button class="recruit-btn btn" id="recruitInfantry">
                        <span class="unit-glyph">步</span>
                        <span class="unit-type">步兵</span>
                        <span class="unit-cost">25<small>g</small></span>
                    </button>
                    <button class="recruit-btn btn" id="recruitCavalry">
                        <span class="unit-glyph">骑</span>
                        <span class="unit-type">骑兵</span>
                        <span class="unit-cost">40<small>g</small></span>
                    </button>
                    <button class="recruit-btn btn" id="recruitArcher">
                        <span class="unit-glyph">炮</span>
                        <span class="unit-type">炮兵</span>
                        <span class="unit-cost">35<small>g</small></span>
                    </button>
                </div>
            </div>

            <!-- 指令区 -->
            <div class="cmd-section">
                <button class="cmd-btn btn" id="endTurnBtn">结束回合</button>
                <button class="cmd-btn btn danger" id="surrenderBtn">投降</button>
            </div>

        </div>

        <!-- 战局统计 -->
        <div id="statsPanel">
            <div id="statsContent"></div>
        </div>

    </div>
</div>

<!-- 胜利覆盖 -->
<div id="victoryOverlay">
    <div id="gameOverText"></div>
    <div id="victoryCampText"></div>
</div>

<!-- 单位悬浮提示 -->
<div id="unitTooltip">
    <div id="tooltipHeader"></div>
    <div id="tooltipHpBar"><div id="tooltipHpFill"></div><span id="tooltipHpText"></span></div>
    <div id="tooltipStats">
        <span class="tooltip-stat" id="tooltipAtk"></span>
        <span class="tooltip-stat" id="tooltipSpd"></span>
        <span class="tooltip-stat" id="tooltipRng"></span>
    </div>
    <div id="tooltipStatus"></div>
    <div id="tooltipPassive"></div>
    <div id="tooltipMorale"></div>
</div>

<!-- 设置面板 -->
<div id="settingsOverlay">
    <div id="settingsPanel">
        <h3>游戏设置</h3>
        <div class="setting-row">
            <label>动画速度</label>
            <input type="range" id="animSpeed" min="0.5" max="2.0" step="0.1" value="1.0">
            <span class="setting-value" id="animSpeedVal">1.0x</span>
        </div>
        <div class="setting-row">
            <label>粒子密度</label>
            <input type="range" id="particleDensity" min="0" max="100" step="5" value="100">
            <span class="setting-value" id="particleDensityVal">100%</span>
        </div>
        <div class="setting-row">
            <label>屏幕震动</label>
            <input type="checkbox" id="screenShake" checked>
        </div>
        <div class="setting-row">
            <label>回合闪光</label>
            <input type="checkbox" id="turnFlash" checked>
        </div>
        <div class="setting-row">
            <label>音效</label>
            <input type="checkbox" id="soundEnabled" checked>
        </div>
        <button id="settingsClose">完成</button>
    </div>
</div>

<!-- 阵营揭示遮罩 -->
<div id="factionReveal">
    <div id="factionRevealInner">
        <div id="factionRevealDice">🎲</div>
        <div id="factionRevealText"></div>
    </div>
</div>

<!-- 二次确认弹窗 -->
<div id="confirmOverlay">
    <div id="confirmPanel">
        <p id="confirmMessage"></p>
        <div class="confirm-btns">
            <button id="confirmYes" class="lobby-btn compact">确认</button>
            <button id="confirmNo" class="lobby-btn compact secondary">取消</button>
        </div>
    </div>
</div>

<!-- 作弊控制台 -->
<div id="cheatConsole" style="display:none">
    <div id="cheatSuggest" style="display:none"></div>
    <input type="text" id="cheatInput" placeholder="输入 / 查看命令" autocomplete="off" spellcheck="false">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
