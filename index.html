<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blades of Hex</title>

<body>

<!-- 竖屏提示 -->

<!-- ===== 加载遮罩（服务器连接前展示） ===== -->

<!-- ===== 大厅（初始隐藏，连接后展示） ===== -->

                    <div class="hero-actions">

                            <span class="hero-btn-content">
                                <span class="hero-btn-title">本地游戏</span>
                                <span class="hero-btn-desc">单人 · 热座 · 遭遇战</span>
                            </span>
                            <span class="hero-btn-arrow">→</span>
                        </button>
                        <button class="hero-btn hero-btn-secondary" id="multiplayerBtn">
                            <span class="hero-btn-icon">🌐</span>
                            <span class="hero-btn-content">
                                <span class="hero-btn-title">联网对战</span>
                                <span class="hero-btn-desc">创建房间 · 加入对战</span>
                            </span>
                            <span class="hero-btn-arrow">→</span>
                        </button>
                        <button class="hero-btn hero-btn-secondary" id="trainingBtn">
                            <span class="hero-btn-icon">⚡</span>
                            <span class="hero-btn-content">
                                <span class="hero-btn-title">训练场</span>
                                <span class="hero-btn-desc">自选将领 vs AI</span>
                            </span>
                            <span class="hero-btn-arrow">→</span>
                        </button>
                    </div>
                    <div class="hero-carousel-dots" id="heroCarouselDots"></div>
                </div>

                <!-- 联机大厅 -->
                <div id="multiplayerLobbyContent" class="lobby-view">
                    <div class="mp-topbar">
                        <button id="backToHomeBtn" class="mp-nav-btn">← 返回首页</button>
                        <span class="mp-topbar-title">在线房间</span>
                        <button id="refreshRoomsBtn" class="mp-nav-btn">↻ 刷新</button>
                    </div>
                    <div id="roomListSection" class="mp-room-section">
                        <div id="roomList" class="mp-room-list"></div>
                        <div id="roomListEmpty" class="mp-room-empty">
                            <span class="mp-empty-icon">⚔</span>
                            <span class="mp-empty-text">暂无可用的房间</span>
                            <span class="mp-empty-hint">创建一个房间邀请好友对战</span>
                        </div>
                    </div>
                    <div class="mp-actions">
                        <button id="createRoomBtn" class="mp-create-btn">+ 创建房间</button>
                    </div>
                </div>

                <!-- 房间等待 -->
                <div id="roomWaitingContent" class="lobby-view">
                    <div id="roomIdDisplay" class="rw-room-card">
                        <span class="rw-room-label">房间号</span>
                        <span id="roomIdValue" class="rw-room-id"></span>
                        <span class="rw-room-hint">将此房间号分享给好友</span>
                    </div>
                    <div id="roomWaitingStatus" class="rw-status">
                        <span class="rw-dot"></span>
                        <span id="roomWaitingText" class="rw-status-text">等待对手加入...</span>
                        <span id="roomWaitingCount" class="rw-count"></span>
                    </div>
                    <div class="rw-actions">
                        <button id="readyBtn" class="rw-ready-btn" disabled>准备</button>
                        <button id="leaveRoomBtn" class="rw-leave-btn">离开房间</button>
                    </div>
                </div>

                <!-- 阵营揭示 + 准备确认（联机开局前） -->
                <div id="lobbyReadyContent" class="lobby-view">
                    <div id="lobbyFaction" class="lobby-faction"></div>
                    <button id="lobbyReadyBtn" class="lobby-ready-btn">准备</button>
                    <div id="lobbyReadyStatus" class="lobby-ready-status"></div>
                </div>

                <!-- 准备弹窗（选择模式 / 创建房间）—— 三级菜单 -->
                <div id="prepContent" class="lobby-view">
                    <div class="prep-topbar">
                        <button id="prepBackBtn" class="mp-nav-btn">← 返回</button>
                        <span id="prepTitle" class="mp-topbar-title">选择模式</span>
                        <span></span>
                    </div>
                    <div class="prep-body">
                        <div class="prep-section">
                            <div class="prep-section-label" id="prepLabel1">对战类型</div>
                            <div class="prep-options" id="prepOptions1"></div>
                        </div>
                        <div class="prep-section" id="prepSectionDiff">
                            <div class="prep-section-label" id="prepLabelDiff">AI 难度</div>
                            <div class="prep-options" id="prepOptionsDiff"></div>
                        </div>
                        <div class="prep-section">
                            <div class="prep-section-label" id="prepLabel2">对战模式</div>
                            <div class="prep-options" id="prepOptions2"></div>
                        </div>
                        <div class="prep-actions">
                            <button id="prepConfirm" class="mp-create-btn">确认</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：将领立绘轮播（始终可见） -->
            <div class="hero-right">
                <div class="hero-portrait-frame">
                    <img id="heroPortraitA" class="hero-portrait active" src="" alt="" />
                    <img id="heroPortraitB" class="hero-portrait" src="" alt="" />
                    <div class="hero-portrait-overlay"></div>
                    <div class="hero-portrait-glow"></div>
                </div>
            </div>

        <div id="connectionBar" class="connection-bar">
            <span class="connection-dot"></span>
            <span id="serverLocation" class="server-location"></span>
            <span id="connectionLabel" style="display:none"></span>
            <span class="connection-bar-spacer"></span>

            <span id="authSlot" class="auth-slot"></span>
            <button id="reconnectBtn" class="reconnect-btn" style="display:none" title="手动重连">重连</button>

</div>

<!-- 开局倒计时 -->
<div id="countdownOverlay">
    <div id="countdownNumber">3</div>
    <div id="countdownLabel">准备战斗</div>
</div>

<!-- ===== 游戏主体（开始后显示） ===== -->
<div id="gameWrapper" style="display:none">

    <div id="gameMain">

                <span id="currentTurn" class="turn-name">红军</span>

                    <span id="weatherLabel">晴</span>

            <!-- 红军信息卡 -->

                <div class="camp-emblem" style="background:rgba(176,48,32,0.9);">

                </div>
                <div class="camp-info">
                    <div class="camp-label">红军</div>
                    <div class="camp-treasury">
                        <span id="player1Gold">$4</span>
                    </div>
                </div>
            </div>

            <!-- 蓝军信息卡（双人模式右对齐，三人模式左对齐统一） -->
            <div class="camp-card align-right" id="campCard2">
                <div class="camp-emblem" style="background:rgba(28,100,160,0.9);">
                    <img class="camp-emblem-portrait" id="emblemP2" src="" alt="" />
                    <span class="camp-emblem-text">蓝</span>
                </div>
                <div class="camp-info align-right">
                    <div class="camp-label">蓝军</div>
                    <div class="camp-treasury">
                        <span id="player2Gold">$4</span>
                    </div>
                </div>
            </div>

            <!-- 绿军信息卡（三人模式） -->

                <div class="camp-emblem" style="background:rgba(40,140,40,0.9);">
                    <img class="camp-emblem-portrait" id="emblemP3" src="" alt="" />
                    <span class="camp-emblem-text">绿</span>
                </div>
                <div class="camp-info">
                    <div class="camp-label">绿军</div>
                    <div class="camp-treasury">
                        <span id="player3Gold">$4</span>
                    </div>
                </div>
            </div>

            <!-- 工具栏 -->

                <div id="networkIndicator">
                    <span>🌐</span>
                    <span id="networkRoleText"></span>
                </div>
                <button class="tool-btn" id="chatToggleBtn" title="聊天 (Ctrl+Enter)" style="display:none">💬</button>
                <button class="tool-btn" id="settingsBtn" title="设置">⚙</button>
            </div>

        </div>

        <!-- 棋盘 -->

            <div id="canvasStage">

                <div id="opponentTurnBanner" class="top-banner">
                    <span>⏳</span><span>等待对手行动...</span>

                <div id="cardTargetingBanner" class="top-banner">
                    <span>🎯</span><span>请选择目标</span>
                </div>
                <div id="notificationBanner" class="top-banner notify-banner">
                    <span></span><span></span>
                </div>
                <div id="tacticalCardArea"></div>
                <div id="cardTooltip"></div>
            </div>
        </div>

    </div>

    <!-- 右侧指挥面板 -->

        <div id="commandPanel" data-camp="p1">

            <!-- 招募区 -->
            <div class="cmd-section">
                <div class="section-label">招募部队</div>
                <div class="recruit-grid">
                    <button class="recruit-btn btn" id="recruitInfantry">

                        <span class="unit-type">步兵</span>
                        <span class="unit-cost"><small>$</small>8</span>
                    </button>
                    <button class="recruit-btn btn" id="recruitCavalry">
                        <span class="unit-glyph">🐎</span>
                        <span class="unit-type">骑兵</span>
                        <span class="unit-cost"><small>$</small>10</span>
                    </button>
                    <button class="recruit-btn btn" id="recruitArcher">
                        <span class="unit-glyph">🎯</span>
                        <span class="unit-type">炮兵</span>
                        <span class="unit-cost"><small>$</small>12</span>
                    </button>
                </div>

            <!-- 指令区 -->

                <button class="cmd-btn btn" id="endTurnBtn">结束回合</button>
                <button class="cmd-btn btn danger" id="surrenderBtn">投降</button>
            </div>

        </div>

        </div>

        <!-- 对策卡手牌画布 -->

    </div>
</div>

        <p id="gameOverSub" class="victory-sub">对局结束</p>
        <div id="gameOverText" class="victory-title"></div>

        <div class="victory-divider"></div>
        <button id="rematchBtn" class="victory-rematch-btn">再来一局</button>

<!-- 查看完整棋局时的返回按钮 -->

<!-- 聊天面板 -->

</div>

<script type="module" src="js/auth.js"></script>
<script>
// ── Auth bootstrap: capture token from URL, render brandSnow + authSlot ──
(function(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const username = params.get('username');
  if (token && username) {
    localStorage.setItem('blades_token', token);
    localStorage.setItem('blades_user', JSON.stringify({ username }));
    const u = new URL(location.href);
    u.searchParams.delete('token'); u.searchParams.delete('username');
    window.history.replaceState({}, '', u);
  }

  const savedToken = localStorage.getItem('blades_token');
  const savedUser = localStorage.getItem('blades_user');
  const brandSnow = document.getElementById('brandSnow');
  const authSlot = document.getElementById('authSlot');

  function renderAuth() {
    if (!authSlot) return;
    if (savedToken && savedUser) {
      try {
        const u = JSON.parse(savedUser);
        authSlot.innerHTML = '<span class="auth-inline-user">' + u.username + '</span><button class="auth-inline-logout" id="authInlineLogout">Exit</button>';
        if (brandSnow) brandSnow.classList.add('logged-in');
        document.getElementById('authInlineLogout')?.addEventListener('click', function() {
          localStorage.removeItem('blades_token');
          localStorage.removeItem('blades_user');
          location.reload();
        });
      } catch { renderLogin(); }
    } else {
      renderLogin();
    }
  }

  function renderLogin() {
    if (!authSlot) return;
    authSlot.innerHTML = '<a class="auth-inline-login" href="/auth/login"><span class="auth-frost" aria-hidden="true">❄</span>登录 Frost ID</a>';
    if (brandSnow) brandSnow.classList.remove('logged-in');
  }

  if (brandSnow) {
    brandSnow.addEventListener('click', function() {
      if (savedToken && savedUser) {
        location.href = 'https://frostrain.tech/dashboard';
      } else {
        location.href = '/auth/login';
      }
    });
  }

  renderAuth();
})();
</script>
