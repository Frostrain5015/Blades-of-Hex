<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blades of Hex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 竖屏提示 -->
<div id="portraitWarning">
    <span>📱</span>
    <span>请将设备横屏使用</span>
</div>

<!-- ===== 大厅（默认显示） ===== -->
<div id="lobbyOverlay">
    <div class="lobby-box">
        <div class="lobby-header">
            <h1 class="lobby-title">海克斯之剑</h1>
            <p class="lobby-subtitle">BLADES OF HEX</p>
        </div>

        <!-- 首页：三个模式按钮 -->
        <div id="lobbyHome" class="lobby-modes">
            <button class="lobby-btn" id="pveGameBtn">
                <span class="lbtn-icon">🤖</span>
                <span class="lbtn-body">
                    <span class="lbtn-name">单人PVE模式</span>
                    <span class="lbtn-desc">一位玩家对战AI敌人</span>
                </span>
            </button>
            <button class="lobby-btn" id="localGameBtn">
                <span class="lbtn-icon">⚔️</span>
                <span class="lbtn-body">
                    <span class="lbtn-name">本地双人模式</span>
                    <span class="lbtn-desc">两位玩家轮流操作</span>
                </span>
            </button>
            <button class="lobby-btn" id="multiplayerBtn">
                <span class="lbtn-icon">🌐</span>
                <span class="lbtn-body">
                    <span class="lbtn-name">联网对战模式</span>
                    <span class="lbtn-desc">创建或加入在线房间</span>
                </span>
            </button>
        </div>

        <!-- 多人游戏大厅 -->
        <div id="multiplayerLobby" style="display:none">
            <div id="lobbyTopBar" class="lobby-topbar">
                <button id="backToHomeBtn" class="lobby-nav-btn" title="返回首页">← 返回</button>
                <span class="lobby-topbar-title">在线房间</span>
                <button id="refreshRoomsBtn" class="lobby-nav-btn" title="刷新列表">↻ 刷新</button>
            </div>
            <div id="roomListSection">
                <div id="roomList" class="room-grid"></div>
                <div id="roomListEmpty" class="room-list-empty">暂无可用房间，请创建一个</div>
            </div>
            <div id="roomActions">
                <div id="roomModeSelect" class="room-mode-select">
                    <button class="room-mode-btn active" data-mode="2">双人</button>
                    <button class="room-mode-btn" data-mode="3">三人</button>
                </div>
                <button id="createRoomBtn" class="lobby-btn compact">创建房间</button>
            </div>
        </div>

        <!-- 房间等待 -->
        <div id="roomWaiting" style="display:none">
            <div id="roomIdDisplay" class="room-id-display">
                <span class="room-id-label">房间号</span>
                <span id="roomIdValue" class="room-id-value"></span>
            </div>
            <div id="roomWaitingStatus" class="room-waiting-status">
                <span class="waiting-dot"></span>
                <span id="roomWaitingText">等待对手加入...</span>
                <span id="roomWaitingCount" class="room-waiting-count"></span>
            </div>
            <div class="room-waiting-actions">
                <button id="readyBtn" class="room-ready-btn" disabled>准备</button>
                <button id="leaveRoomBtn" class="room-leave-btn">离开房间</button>
            </div>
        </div>

        <!-- 阵营揭示 + 准备确认（联机开局前，兼容旧逻辑） -->
        <div id="lobbyReady" style="display:none">
            <div id="lobbyFaction" class="lobby-faction"></div>
            <button id="lobbyReadyBtn" class="lobby-ready-btn">准备</button>
            <div id="lobbyReadyStatus" class="lobby-ready-status"></div>
        </div>
        <div id="connectionBar" class="connection-bar">
            <span class="connection-dot"></span>
            <span id="connectionLabel" class="connection-label">未连接</span>
            <button id="reconnectBtn" class="reconnect-btn" style="display:none" title="手动重连">重连</button>
        </div>
        <div id="lobbyStatus" class="lobby-status"></div>
    </div>
</div>

<!-- ===== 游戏主体（开始后显示） ===== -->
<div id="gameWrapper" style="display:none">

    <div id="gameMain">

        <!-- 顶部信息条 -->
        <div id="topBar">

            <!-- 回合指示器 + 天气 -->
            <div class="turn-hub turn-hub--left">
                <span class="turn-label">当前回合</span>
                <span id="currentTurn" class="turn-name">红军</span>
                <div id="weatherBadge" class="weather-badge">
                    <span id="weatherIcon">☀️</span>
                    <span id="weatherLabel">晴</span>
                </div>
            </div>

            <!-- 红军信息卡 -->
            <div class="camp-card" id="campCard1">
                <div class="camp-emblem" style="background:rgba(176,48,32,0.9);">红</div>
                <div class="camp-info">
                    <div class="camp-label">红军</div>
                    <div class="camp-treasury">
                        <span id="player1Gold">40</span>
                        <span class="treasury-unit">Gold</span>
                    </div>
                </div>
            </div>

            <!-- 蓝军信息卡（双人模式右对齐，三人模式左对齐统一） -->
            <div class="camp-card align-right" id="campCard2">
                <div class="camp-emblem" style="background:rgba(28,100,160,0.9);">蓝</div>
                <div class="camp-info align-right">
                    <div class="camp-label">蓝军</div>
                    <div class="camp-treasury">
                        <span id="player2Gold">40</span>
                        <span class="treasury-unit">Gold</span>
                    </div>
                </div>
            </div>

            <!-- 绿军信息卡（三人模式） -->
            <div class="camp-card" id="campCard3" style="display:none">
                <div class="camp-emblem" style="background:rgba(40,140,40,0.9);">绿</div>
                <div class="camp-info">
                    <div class="camp-label">绿军</div>
                    <div class="camp-treasury">
                        <span id="player3Gold">40</span>
                        <span class="treasury-unit">Gold</span>
                    </div>
                </div>
            </div>

            <!-- 工具栏 -->
            <div class="topbar-tools">
                <div id="networkIndicator">
                    <span>🌐</span>
                    <span id="networkRoleText"></span>
                </div>
                <button class="tool-btn" id="saveGameBtn" title="存档 (Ctrl+S)">💾</button>
                <button class="tool-btn" id="loadGameBtn" title="读档 (Ctrl+L)">📂</button>
                <button class="tool-btn" id="settingsBtn" title="设置">⚙</button>
            </div>

        </div>

        <!-- 棋盘 -->
        <div id="canvasWrapper">
            <div id="canvasStage">
                <canvas id="gameCanvas" width="1000" height="750"></canvas>
                <div id="opponentTurnBanner" class="top-banner">
                    <span>⏳</span><span>等待对手行动...</span>
                </div>
                <div id="cardTargetingBanner" class="top-banner">
                    <span>🎯</span><span>请选择目标</span>
                </div>
                <div id="notificationBanner" class="top-banner notify-banner">
                    <span></span><span></span>
                </div>
                <div id="tacticalCardArea"></div>
                <div id="cardTooltip"></div>
            </div>
        </div>

    </div>

    <!-- 右侧指挥面板 -->
    <div id="rightPanel">

        <div id="commandPanel" data-camp="p1">

            <!-- 招募区 -->
            <div class="cmd-section">
                <div class="section-label">招募部队</div>
                <div class="recruit-grid">
                    <button class="recruit-btn btn" id="recruitInfantry">
                        <span class="unit-glyph">⚔️</span>
                        <span class="unit-type">步兵</span>
                        <span class="unit-cost">40<small>g</small></span>
                    </button>
                    <button class="recruit-btn btn" id="recruitCavalry">
                        <span class="unit-glyph">🐎</span>
                        <span class="unit-type">骑兵</span>
                        <span class="unit-cost">50<small>g</small></span>
                    </button>
                    <button class="recruit-btn btn" id="recruitArcher">
                        <span class="unit-glyph">💣</span>
                        <span class="unit-type">炮兵</span>
                        <span class="unit-cost">50<small>g</small></span>
                    </button>
                </div>
            </div>

            <!-- 指令区 -->
            <div class="cmd-section">
                <button class="cmd-btn btn" id="endTurnBtn">结束回合</button>
                <button class="cmd-btn btn danger" id="surrenderBtn">投降</button>
            </div>

        </div>

        <!-- 战局统计 -->
        <div id="statsPanel">
            <div id="statsContent"></div>
        </div>

        <!-- 对策卡手牌画布 -->
        <canvas id="cardCanvas" width="360" height="620"></canvas>

    </div>
</div>

<!-- 胜利覆盖 -->
<div id="victoryOverlay">
    <div id="victoryPanel">
        <p id="gameOverSub" class="victory-sub">对局结束</p>
        <div id="gameOverText" class="victory-title"></div>
        <div id="victoryCampText" class="victory-camp"></div>
        <div class="victory-divider"></div>
        <button id="rematchBtn" class="victory-rematch-btn">再来一局</button>
        <button id="exitToLobbyBtn" class="victory-exit-btn">退出</button>
        <div id="rematchStatus" class="rematch-status"></div>
    </div>
</div>

<!-- 单位悬浮提示 -->
<div id="unitTooltip">
    <div id="tooltipHeader"></div>
    <div id="tooltipHpBar"><div id="tooltipHpFill"></div><span id="tooltipHpText"></span></div>
    <div id="tooltipStats">
        <span class="tooltip-stat" id="tooltipAtk"></span>
        <span class="tooltip-stat" id="tooltipDef"></span>
        <span class="tooltip-stat" id="tooltipSpd"></span>
        <span class="tooltip-stat" id="tooltipRng"></span>
        <span class="tooltip-stat" id="tooltipCD"></span>
    </div>
    <div id="tooltipSkillInfo"></div>
    <div id="tooltipStatus"></div>
    <div id="tooltipPassive"></div>
    <div id="tooltipMorale"></div>
    <button id="tooltipActiveSkill" class="tooltip-skill-btn" style="display:none"></button>
</div>

<!-- 设置面板 -->
<div id="settingsOverlay">
    <div id="settingsPanel">
        <h3>游戏设置</h3>
        <div class="setting-row">
            <label>动画速度</label>
            <div class="speed-btns">
                <button class="speed-btn" data-speed="0.6">慢</button>
                <button class="speed-btn active" data-speed="1.0">正常</button>
                <button class="speed-btn" data-speed="1.8">快</button>
            </div>
        </div>
        <div class="setting-row">
            <label>屏幕震动</label>
            <input type="checkbox" id="screenShake" checked>
        </div>
        <div class="setting-row">
            <label>音效</label>
            <input type="checkbox" id="soundEnabled" checked>
        </div>
        <button id="settingsClose">完成</button>
        <button id="settingsExit" class="settings-exit-btn" style="display:none">退出</button>
    </div>
</div>

<!-- 阵营揭示遮罩 -->
<div id="factionReveal">
    <div id="factionRevealInner">
        <div id="factionRevealDice">🎲</div>
        <div id="factionRevealText"></div>
    </div>
</div>

<!-- 将领选择浮层 -->
<div id="commanderOverlay">
    <div class="commander-panel">
        <h2 id="commanderTitle">选择将领</h2>
        <div id="commanderCards" class="commander-cards"></div>
        <div id="commanderStatus" class="commander-status">点击将领预选，再次点击确认</div>
    </div>
</div>

<!-- 二次确认弹窗 -->
<div id="confirmOverlay">
    <div id="confirmPanel">
        <p id="confirmMessage"></p>
        <div class="confirm-btns">
            <button id="confirmYes" class="lobby-btn compact">确认</button>
            <button id="confirmNo" class="lobby-btn compact secondary">取消</button>
        </div>
    </div>
</div>

<!-- 作弊控制台 -->
<div id="cheatConsole" style="display:none">
    <div id="cheatSuggest" style="display:none"></div>
    <input type="text" id="cheatInput" placeholder="输入 / 查看命令" autocomplete="off" spellcheck="false">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module" src="js/main.js?v=22"></script>
</body>
</html>
